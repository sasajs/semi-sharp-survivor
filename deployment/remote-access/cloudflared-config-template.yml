# Cloudflare Tunnel Configuration Template
# Copy this file to ~/.cloudflared/config.yml or /etc/cloudflared/config.yml

# The unique tunnel link UUID generated by: 'cloudflared tunnel create semi-sharp-tunnel'
tunnel: YOUR_TUNNEL_UUID_HERE

# Paths to credentials JSON files generated during the creation process
credentials-file: /root/.cloudflared/YOUR_TUNNEL_UUID_HERE.json

# Traffic ingestion translation rules
ingress:
  # Route secure hostnames to local application endpoints
  - hostname: semi-sharp.your-domain.com
    service: http://localhost:3000

  # Serve simple health diagnostics directly
  - hostname: health.your-domain.com
    service: http://localhost:3000/api/system/health

  # Default fall-through 404 response handler rule (REQUIRED as final block)
  - service: http_status:404
